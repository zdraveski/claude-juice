# Publishes a GitHub Release when a version tag is pushed, for example: git tag v1.5.3 && git push origin v1.5.3
# It first runs every test (test.yml), then checks the tag matches package.json, .claude-plugin/plugin.json
# and a CHANGELOG.md entry, and uses that entry as the release notes.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version and take the changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --notes-file notes.md
