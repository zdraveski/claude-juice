# Runs every test on Windows, macOS and Linux, with the two newest long-term Node versions juice supports,
# on every push and pull request, then installs juice the way Claude Code does and runs the real status line
# through the shell Claude Code uses (Git Bash on Windows). Free for public repositories.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # a "Run workflow" button on the Actions tab

permissions:
  contents: read # it only reads the code

jobs:
  test:
    timeout-minutes: 15 # a test left waiting on a process must not hold a runner for hours
    strategy:
      fail-fast: false # one system failing must not hide the others' results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to exact commits (the tags named after each), so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: End to end, through the shell Claude Code uses
        shell: bash
        run: node scripts/e2e.mjs
      - name: Mac Keychain, through the real security tool
        if: runner.os == 'macOS'
        run: node scripts/mac-keychain.mjs

  customizer:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI_REQUIRE_PLAYWRIGHT: 1 # a missing Playwright must fail this job, not skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm i -g playwright@1.65.0 # pinned, so a new release can't turn this red on its own
      - run: playwright install --with-deps chromium
      - run: node scripts/check-customizer.js
