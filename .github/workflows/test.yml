# Runs every test on Windows, macOS and Linux, with the oldest Node juice supports (18) and current ones,
# on every push and pull request. Free for public repositories.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # a "Run workflow" button on the Actions tab

jobs:
  test:
    strategy:
      fail-fast: false # one system failing must not hide the others' results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
